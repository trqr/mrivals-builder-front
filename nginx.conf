server {
    listen 443 ssl http2;
    server_name mrivals-builder.fr www.mrivals-builder.fr;

    # Certificats (Certbot les remplit automatiquement)
    ssl_certificate /etc/letsencrypt/live/ton-domaine.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ton-domaine.fr/privkey.pem;

    # Réglages SSL recommandés
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    # API reverse proxy
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://mrivals-api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fallback React Router
    location / {
        try_files $uri /index.html;
    }

    # Cache fichiers statiques
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }
}
