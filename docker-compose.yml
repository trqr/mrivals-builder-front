version: "3.9"

services:
  mrivals-front:
    build: .
    container_name: mrivals-front
    expose:
      - "80"   # 🔥 obligatoire pour Traefik
    restart: always

    labels:
      - "traefik.enable=true"

      # ROUTEUR FRONT HTTPS
      - "traefik.http.routers.mrivals-front.rule=Host(`mrivals-builder.com`) || Host(`www.mrivals-builder.com`) || Host(`mrivals.trqr.fr`)"
      - "traefik.http.routers.mrivals-front.entrypoints=websecure"
      - "traefik.http.routers.mrivals-front.tls.certresolver=le"
      - "traefik.http.routers.mrivals-front.tls=true"

      # SERVICE (port interne du container)
      - "traefik.http.services.mrivals-front.loadbalancer.server.port=80"

    networks:
      - traefik-network

networks:
  traefik-network:
    external: true
    name: traefik-network